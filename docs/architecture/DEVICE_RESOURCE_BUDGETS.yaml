# DEVICE RESOURCE BUDGETS — Gen8 (P0-B Invisible Runtime)
# Doc status: CANONICAL (targets/placeholders) | Phase: 0 | Date: 2026-10-18
# Refs: PROMPT 000A §9; Bible §189-193, §261, §509, §556, §36(P000).
# Phase-0: TARGET CLASSES + measurement protocol only. Do NOT invent acceptable absolute values
# before a real-device baseline. Values are UNSET_PENDING_BASELINE unless device-measured.

meta:
  version: 0.1.0
  phase: 0
  value_labels: [TARGET, MEASURED, UNSET_PENDING_BASELINE]
  measurement_protocol: >
    Measured on lowest supported device across ECO/BALANCED/MAX_PROTECTION, foreground/background,
    charging/idle, normal/thermal-constrained/low-power. No simulator values count. Owner: resource-governor.
  golden_rule: "ALWAYS AVAILABLE, NOT ALWAYS EXPENSIVE. Never claim zero battery/heat."

modes:
  ECO: {intent: minimal footprint, sensing: change-driven only, deep_analysis: deferred to charging/idle}
  BALANCED: {intent: default, sensing: adaptive, deep_analysis: when it changes the decision}
  MAX_PROTECTION: {intent: strongest coverage, sensing: higher sampling, deep_analysis: eager within budget}

budgets:   # one entry per required category; all UNSET until baseline
  idle_cpu: {label: UNSET_PENDING_BASELINE, note: near-zero idle target (§260)}
  active_cpu: {label: UNSET_PENDING_BASELINE}
  gpu_npu: {label: UNSET_PENDING_BASELINE, note: prefer accelerators for inference}
  memory: {label: UNSET_PENDING_BASELINE, note: bounded buffers}
  battery_per_hour: {label: UNSET_PENDING_BASELINE, per_mode: true}
  energy_per_decision: {label: UNSET_PENDING_BASELINE, note: measurable energy-per-decision (§36 P000)}
  thermal_state: {label: UNSET_PENDING_BASELINE, note: downgrade on thermal pressure}
  network_bytes_per_decision: {label: UNSET_PENDING_BASELINE, note: cache-first minimizes}
  background_wakeups: {label: UNSET_PENDING_BASELINE, direction: minimize}
  frame_sampling_rate: {label: UNSET_PENDING_BASELINE, note: no continuous 30/60fps inference}
  model_invocations: {label: UNSET_PENDING_BASELINE, note: smallest sufficient; early exit}
  local_cache_size: {label: UNSET_PENDING_BASELINE, policy: TTL + LRU}
  raw_frame_buffer_size: {label: UNSET_PENDING_BASELINE, policy: ephemeral, discard after features}
  launch_time: {label: UNSET_PENDING_BASELINE, direction: minimize}
  ui_frame_time: {label: UNSET_PENDING_BASELINE, note: no jank; target 60/120fps per device}

degradation_behavior:
  on_thermal_constrained: [downgrade mode -> ECO, reduce sampling, defer deep analysis, surface honest coverage]
  on_low_power: [downgrade -> ECO, cache-only where possible, pause non-essential capture]
  on_memory_pressure: [shrink buffers, evict LRU cache, reduce candidate queue depth]

stop_conditions:
  - sustained thermal-critical -> suspend heavy inference, keep safe honest state
  - low-power + user not consenting to drain -> minimal mode
  - any case: NEVER show stale safe/green state while degraded

requirements: [OPS-001, OPS-002]
release_gate: "P0-B — dual-evidence DoD requires device-health evidence (D-0016)."

# PROMPT 005 device-health gate (§25):
device_health_gate:
  status: LAB_NO_OBVIOUS_DEGRADATION    # NOT device certification
  lab_evidence: "real-media E2E ~192-218ms/short-clip (macOS); sparse 16-frame decode; idle=0 work; cache reuse avoids re-decode"
  device_measured: none                 # PENDING_EXTERNAL_DEPENDENCY (no Team) — see P005_DEVICE_EVIDENCE.md
  note: "no 'device feels nothing' claim without physical-device Instruments evidence"

