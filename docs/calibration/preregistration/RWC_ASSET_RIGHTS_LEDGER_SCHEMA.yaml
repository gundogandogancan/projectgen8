    "licenseType",
    "licenseEvidence (opaque pointer; never secrets)",
    "allowedUse[]",
    "prohibitedUse[]",
    "trainingAllowed",
    "evaluationAllowed",
    "derivativeRights",
    "redistributionAllowed",
    "language",
    "contentType",
    "modality",
    "acquisitionDate (ISO-8601)",
    "expiryDate?",
    "revocationState (ACTIVE|REVOKED|EXPIRED)",
    "revocationDate?",
    "contentHash (sha256 hex 64)",
    "provenanceChain[]",
    "consentBasis?",
    "jurisdictionNotes?",
    "notes?"
  ],
  "lifecycle": [
    "acquire",
    "verify-rights",
    "hash",
    "register",
    "eligibility",
    "split-assignment(later)",
    "use",
    "revoke/delete/expire"
  ],
  "revocation_law": "revoked => INELIGIBLE for all future fitting/evaluation; training/evaluation/redistribution flags forced false; derivative artifacts governed by derivativeRights terms; audit trail (opaque IDs+hashes+decisions) retained; prohibited raw content not retained; NO un-revoke API (new registration + new evidence required)",
