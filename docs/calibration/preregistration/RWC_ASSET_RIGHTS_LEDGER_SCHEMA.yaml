{
  "schema_version": "rwc-asset-rights-ledger-v1",
  "format_law": "STRICT JSON SUBSET OF YAML 1.2. Machine schema for RWCAssetRightsRecordV1 (code twin: RWCAssetRightsLedgerV1.swift). ZERO records exist by design (corpus_count=0).",
  "eligible_source_classes": [
    "PROJECT_OWNED_REAL",
