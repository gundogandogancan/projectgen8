  "audit_result_law_v3": "The R5 machine audit result lives ONLY at the canonical constant docs/audit/RWC_PRE14_R5_AUDIT_RESULT.json (schema RWC_PRE14_AUDIT_RESULT_SCHEMA_V3.yaml; result_version rwc-pre14-audit-result-v3); RWCCorpusEntryVerifierV5 requires lock.audit_result_path == that constant and reads the blob via git show <audit_commit>:<path>. COUNT LAWS carried from schema V2: every count is a strict non-negative integer (bool/float/string refused); baseline_count + fresh_probe_count == total_count; verdict strict enum {PASS, FIX_REQUIRED, BLOCKED}; PASS additionally requires critical==high==medium==0. The R4 result (RWC_PRE14_R4_AUDIT_RESULT.json) remains FIX_REQUIRED 0/2/2 forever; the R3 result remains FIX_REQUIRED 0/5/5 forever.",
