  "trust_root_law": "A18-F1 closed — THE CENTRAL R5 PRINCIPLE: SIGNATURE AUTHENTICITY != TRUST AUTHORITY. A valid Ed25519 signature only proves SOME key signed; it never proves the signer is AUTHORIZED. Authority is a GOVERNED CHAIN the caller cannot forge at any link: GOVERNED ROOT -> ROOT-SIGNED REGISTRY DOCUMENT -> REVIEWER -> SIGNED REVIEW -> VERIFIED GRANT V3 -> PRE-ACQUISITION AUTHORIZATION V2 -> RUNNER V3. The ROOT is an Ed25519 public key with a governance record (RWCReviewerTrustRootV1, rootID rwc-root-*). Its ONLY production instance lives at docs/operations/rwc/RWC_REVIEWER_TRUST_ROOT.json; private key material is NEVER committed. There is NO caller-supplied registry on the lawful path: RWCVerifiedReviewerRegistryV1 is mintable ONLY by RWCReviewerRegistryVerifierV1.verify, which checks the ROOT signature over the canonical length-prefixed registry document. FAIL CLOSED: RWCReviewerTrustRootLoaderV1.loadProduction returns .noOperationalRoot when the governed file is absent (it IS absent in R5). ONBOARDING BLOCKER RWC-REVIEWER-ROOT-ONBOARDING: no reviewer trust root has been operationally created; no first asset can be acquired until a governed onboarding artifact (public-key-only) exists (see RWC_REVIEWER_ROOT_ONBOARDING_LAW_V1.md). Tests use only the clearly-named synthetic factory RWCReviewerTrustRootLoaderV1.makeSyntheticTestRoot; no committed private key, no production root fabricated.",
