  "durable_receipt_law": "A18-F3/§35-§45/§69-§73 closed: the acquisition receipt is DURABLE. RWCAcquisitionReceiptStoreV1 is a single-writer (flock) store in a dedicated directory; each receipt is a canonical fixed-order body + a SHA-256 integrity line. HONEST WORDING: the SHA-256 line is CORRUPTION DETECTION (local disk integrity), NOT tamper-proof authentication — unforgeable authority lives upstream in the signed review / verified grant / verified corpus-entry proof. State PREPARED -> PROMOTION_CONFIRMED -> COMPLETED. RWCCorpusAcquisitionRunnerV3 persists the PREPARED receipt durably AFTER the rights commit and BEFORE the corpus promote; confirmPromotion + complete follow the promote; the returned value is derived from the durable record. Duplicate sessionID at prepare is a typed refusal; transitions are idempotent.",
  "corpus_completion_law": "A18-F3/§72-§73 closed: after a post-promote crash the durable PREPARED receipt + the asset present in the corpus store let RWCCorpusAcquisitionRunnerV3.reconcileV3 finalize the receipt (confirm+complete) WITHOUT a double promotion. A PREPARED receipt with a recoverable quarantine payload is promoted then finalized. reconcileV3 is idempotent (run twice => no duplicate receipt or promotion).",
