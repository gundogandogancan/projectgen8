{
  "slice_schema_version": "rwc-slices-v2",
  "format_law": "STRICT JSON SUBSET OF YAML. Frozen pre-data (RWC-PRE-10). Underpowered => UNKNOWN/INSUFFICIENT_DATA; never aggregate-hidden; overlapping membership is EXPECTED (an item may belong to many slices). V2 (A14-F8/F9/F18): tri-state power law - REPORTABLE (min_n met: metrics+debiased gap+CI, NO pass/fail), GATE_POWERED (slice n >= 800 per the frozen power law: hard calibration gate applies), UNDERPOWERED (below min_n: UNKNOWN/INSUFFICIENT_DATA). Decision coverage is reported per slice; the overall in-distribution coverage >= 0.80 gate applies globally. Multiplicity classes per gate registry.",
  "defaults": {
    "min_n": 60,
    "min_pos": 15,
    "min_neg": 15,
    "metrics": [
      "MAE",
      "ECE",
      "Brier",
      "abstention_rate"
    ],
    "safety_metric": "falseSafe (zero-observed + rule-of-three UB)",
    "ci": "Wilson (proportions) / seeded bootstrap B=2000 (ECE,MAE)"
  },
