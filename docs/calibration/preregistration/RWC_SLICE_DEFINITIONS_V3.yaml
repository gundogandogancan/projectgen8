  "slice_count": 22,
  "power_states": {
    "REPORTABLE": "min_n met; descriptive metrics + CI reported; cannot PASS/FAIL a hard gate; applies under rwc-calibration-methodology-v3",
    "GATE_POWERED": "slice n >= 800 (same power law as overall per rwc-calibration-methodology-v3: S=999 exact MC test, smallest n in {400,800,1600} with rejection >= 0.80 against over@.07 AND under@.07 for ALL six predeclared confidence shapes; initially NO slice is gate-powered - honest)",
    "UNDERPOWERED": "below min_n; UNKNOWN/INSUFFICIENT_DATA; never aggregate-hidden"
  },
  "power_tri_state_law": "Every slice falls into exactly one of REPORTABLE/GATE_POWERED/UNDERPOWERED at evaluation time. GATE_POWERED implies REPORTABLE. A slice whose n is between min_n and 799 is REPORTABLE but NOT GATE_POWERED: descriptive metrics are provided but the hard calibration gate does not apply. A slice below min_n is UNDERPOWERED: results are UNKNOWN/INSUFFICIENT_DATA and MUST be reported as such — never aggregated away or silently omitted.",
  "decision_coverage_note": "decision_coverage is reported per slice alongside abstention_rate; the global in-distribution decision_coverage >= 0.80 gate governs the overall decided set; per-slice abstention is informational and not separately gated except as UNDERPOWERED status applies."
