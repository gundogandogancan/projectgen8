# PLATFORM CAPABILITY MATRIX — Gen8
# Doc status: CANONICAL | Phase: 0 | Date: 2026-10-18
# Refs: Bible §16, §174, §196-203, §291-299, §527-543; Prompt 000 §4, §I, §54.
# EVERY capability value is EXACTLY one of:
#   VERIFIED | UNVERIFIED | UNSUPPORTED | REQUIRES_CURRENT_OFFICIAL_VERIFICATION (RCOV)
# At Phase 0 NOTHING has been device-verified. The Build Bible's §16/§334 capability claims are
# "capability-exists" level only; Prompt 000 §54 requires re-verifying current official docs at
# implementation time. Therefore every platform-API claim below is RCOV unless device-proven.
# Capability tiers (D-0004): C5 full controlled guardian > C4 system guardian > C3 observe+warn
#   > C2 app-local guardian > C1 companion > C0 unsupported. Never show a false PROTECTED state.

meta:
  version: 0.1.0
  phase: 0
  legend:
    VERIFIED: proven on real device/current official docs with evidence artifact
    UNVERIFIED: plausible, not yet checked this cycle
    UNSUPPORTED: known not possible / policy-forbidden
    RCOV: REQUIRES_CURRENT_OFFICIAL_VERIFICATION before any implementation claim
  capability_axes:
    - screen_observation          # can app observe permitted screen/content?
    - audio_observation
    - persistent_guardian_surface # can show always-available Guardian surface?
    - controlled_player_prefilter # true pre-exposure on a controllable player?
    - family_authority_api        # OS-native guardian/child authority?
    - secure_key_storage
    - on_device_inference
    - background_execution
    - billing_subscription
  global_rules:
    - No native third-party feed control is claimed anywhere (warn/analyze only). (§234, §47)
    - "Persistent top-right overlay across arbitrary native apps" is a CAPABILITY GAP unless an OS API permits it. (§181, §5720)

platforms:

  apple_ios_ipados:
    target: true
    current_build_targets: [iphoneos, iphonesimulator, xros]   # from pbxproj
    tier_target: C3-C4 (surface-dependent)
    capabilities:
      screen_observation: RCOV            # ScreenCaptureKit scope on iOS/iPadOS (§198, §292)
      audio_observation: RCOV
      persistent_guardian_surface: RCOV   # Dynamic Island / Live Activities (ActivityKit) (§581, §605)
      controlled_player_prefilter: RCOV   # only on controllable players (not native 3rd-party feed)
      family_authority_api: RCOV          # FamilyControls/ManagedSettings/DeviceActivity + entitlement (§418, §454)
      secure_key_storage: RCOV            # Keychain / Secure Enclave
      on_device_inference: RCOV           # Core ML / Vision / Speech / Sound Analysis
      background_execution: RCOV
      billing_subscription: RCOV          # StoreKit auto-renewable + intro trial (§302)
    notes: Primary P0-C target (user wants Xcode first). visionOS included in build targets.

  apple_macos:
    target: true
    current_build_targets: [macosx]
    tier_target: C4 (menu bar / browser extension)
    capabilities: {screen_observation: RCOV, audio_observation: RCOV, persistent_guardian_surface: RCOV, controlled_player_prefilter: RCOV, family_authority_api: RCOV, secure_key_storage: RCOV, on_device_inference: RCOV, background_execution: RCOV, billing_subscription: RCOV}
    notes: ScreenCaptureKit documented across macOS (§198, §292) — RCOV.

  apple_visionos_xr:
    target: true
    tier_target: C2-C3 (peripheral ambient signal)
    capabilities: {screen_observation: RCOV, audio_observation: RCOV, persistent_guardian_surface: RCOV, controlled_player_prefilter: UNVERIFIED, family_authority_api: RCOV, secure_key_storage: RCOV, on_device_inference: RCOV, background_execution: RCOV, billing_subscription: RCOV}

  android:
    target: true
    tier_target: C3-C4
    capabilities:
      screen_observation: RCOV            # MediaProjection + foreground service (§199, §535)
      audio_observation: RCOV
      persistent_guardian_surface: RCOV   # TYPE_APPLICATION_OVERLAY where permitted (policy-gated)
      controlled_player_prefilter: RCOV
      family_authority_api: RCOV
      secure_key_storage: RCOV            # Android Keystore
      on_device_inference: RCOV           # LiteRT / ML Kit / on-device GenAI
      background_execution: RCOV
      billing_subscription: RCOV          # Play Billing + trial (§303)
    notes: AccessibilityService is NOT the sensing foundation (§16 Google Play policy). FLAG_SECURE content UNSUPPORTED for capture.

  chromeos:
    target: true
    tier_target: C2-C3 (via browser/Android)
    capabilities: {screen_observation: RCOV, persistent_guardian_surface: RCOV, controlled_player_prefilter: RCOV, on_device_inference: UNVERIFIED, billing_subscription: RCOV}

  windows:
    target: true
    tier_target: C3-C4 (tray / always-on-top / extension)
    capabilities: {screen_observation: RCOV, audio_observation: RCOV, persistent_guardian_surface: RCOV, controlled_player_prefilter: RCOV, secure_key_storage: RCOV, on_device_inference: RCOV, background_execution: RCOV, billing_subscription: RCOV}
    notes: Windows.Graphics.Capture, Windows ML/ONNX Runtime, NPU/GPU EPs (§200) — RCOV.

  linux:
    target: true
    tier_target: C2-C3 (panel / extension)
    capabilities: {screen_observation: RCOV, audio_observation: RCOV, persistent_guardian_surface: UNVERIFIED, controlled_player_prefilter: RCOV, secure_key_storage: RCOV, on_device_inference: UNVERIFIED, background_execution: RCOV, billing_subscription: RCOV}
    notes: XDG Desktop Portal + PipeWire; Wayland-first, X11 fallback (§202, §538) — RCOV.

  browsers:
    families: [safari_web_extension, chromium_mv3, edge, firefox_webext, brave, opera]
    tier_target: C2-C3 (safe-area fixed adaptive bar; controlled page prefilter)
    capabilities:
      screen_observation: RCOV            # content scripts / page observation (§31 P000, §531)
      persistent_guardian_surface: RCOV   # fixed adaptive bar in page
      controlled_player_prefilter: RCOV   # e.g. embedded players; YouTube IFrame seekTo (§387)
      on_device_inference: UNVERIFIED
      billing_subscription: UNVERIFIED
    notes: Minimum permissions only; no password/payment-field capture. Site adapters versioned independently.

  tv:
    families:
      apple_tvos: {tier_target: C2-C3, capabilities: {controlled_player_prefilter: RCOV, persistent_guardian_surface: RCOV, screen_observation: RCOV}}  # §292
      android_tv_google_tv: {tier_target: C2-C3, capabilities: {controlled_player_prefilter: RCOV, screen_observation: RCOV}}  # §293
      fire_os: {tier_target: C2, note: Android-compatible lineage}            # §539
      fire_vega_os: {tier_target: C1-C2, note: NOT Android-compatible}        # §539
      samsung_tizen: {tier_target: C2, capabilities: {controlled_player_prefilter: RCOV}}  # §540
      lg_webos: {tier_target: C2, capabilities: {controlled_player_prefilter: RCOV}}       # §541
      roku: {tier_target: C1-C2, note: SceneGraph}                            # §542
    global_note: TV surface = overscan-safe minimal corner badge (§300). No screen-wide guardian without official APIs.

  companion:
    families: [watchos, wear_os]
    tier_target: C1 (glance / approval / alert companion)
    capabilities: {persistent_guardian_surface: UNVERIFIED, family_authority_api: RCOV, billing_subscription: UNSUPPORTED}

  consoles:
    families: [playstation, xbox]
    tier_target: C0-C1
    capabilities: {screen_observation: UNSUPPORTED, persistent_guardian_surface: UNSUPPORTED}
    notes: No screen-wide guardian without official APIs (§543). Default unsupported/companion.

verification_backlog:
  - Re-verify all RCOV items against CURRENT official docs at implementation time (per platform), producing a citation + last_verified date + device evidence. Owner: platform-api specialist + official-source-verification skill.

