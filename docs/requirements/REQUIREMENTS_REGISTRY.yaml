  - id: OPS-002
    title: Invisible runtime / device-health budgets (P0-B co-equal gate)
    description: >
      The Guardian must not materially degrade the device: bounded idle/active CPU-GPU-NPU, memory,
      battery/hr, energy-per-decision, thermal, wakeups, network bytes/decision, launch time, UI frame
      time; change-driven sensing; early exit; ECO/BALANCED/MAX modes + degradation behavior.
    rationale: PROMPT 000A §1/§9/§10 — P0-B is co-equal release gate with P0-A (D-0012).
    priority: P0
    owner: resource-governor
    status: PROPOSED
    depends_on: [AI-001]
    acceptance_criteria:
      - Measured on lowest supported device per mode; no material user-perceived degradation.
      - Thermal/low-power/memory-pressure degradation behaves per DEVICE_RESOURCE_BUDGETS.
      - Never "zero battery/heat" claims; never stale safe state while degraded.
    evidence_required: [device_resource_benchmark]
